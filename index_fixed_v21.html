<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7e9d6"><title>うんこ面接！ Ver.2.1 10秒チャレンジ</title><style>
:root{--ink:#472b21;--tan:#bd7d50;--cream:#fff7e9;--red:#db4c4b}*{box-sizing:border-box}html,body{margin:0;overscroll-behavior:none}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",system-ui,sans-serif;color:var(--ink);background:#e6c7a7}main{width:min(100%,480px);min-height:100dvh;margin:auto;padding:14px 14px max(20px,env(safe-area-inset-bottom));background:linear-gradient(#fff2df,#f4d5b4);box-shadow:0 0 30px #67412245}header{text-align:center}h1{font-size:clamp(27px,8vw,38px);line-height:1.2;margin:4px 0;color:#69371f;text-shadow:2px 2px white}header p{font-size:12px;font-weight:800;margin:4px 0 10px}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}.stat{background:#fff9ef;border:2px solid #d9ae88;border-radius:15px;padding:7px 3px;text-align:center;box-shadow:0 3px #c68c62}.stat span{display:block;font-size:10px;font-weight:900}.stat b{font-size:25px;font-variant-numeric:tabular-nums}.stat b small{font-size:13px}.stage{position:relative;width:100%;aspect-ratio:4/5;max-height:58dvh;overflow:hidden;border:4px solid #97623e;border-radius:22px;box-shadow:0 7px #b47e56;background:#ddbc9c;touch-action:manipulation}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.bubble{position:absolute;top:13px;left:12px;max-width:65%;padding:9px 12px;border:2px solid #ae866a;border-radius:16px;background:#fffdf7ed;box-shadow:0 3px 8px #482b2230;font-size:13px;font-weight:900;pointer-events:none}.bubble:after{content:"";position:absolute;bottom:-11px;left:35px;border-width:11px 10px 0;border-style:solid;border-color:#fffdf7 transparent transparent}.notice{position:absolute;top:12px;right:10px;padding:7px 9px;border-radius:12px;background:#7e3e29;color:white;font-size:11px;font-weight:900;opacity:0;transition:opacity .15s;pointer-events:none}.notice.on{opacity:1;background:#d84c43}.meterrow{display:flex;align-items:center;gap:8px;margin:13px 1px 8px;font-size:12px;font-weight:900}.meter{height:16px;flex:1;border-radius:100px;background:#ead4bd;overflow:hidden;border:2px solid #a67759}.fill{height:100%;width:0%;background:linear-gradient(90deg,#e8bb4e,#ee7a37,#dd4444);transition:width .1s linear}.tip{text-align:center;min-height:26px;margin:5px 0 8px;font-size:13px;font-weight:900}.btn{display:block;width:100%;border:0;border-radius:16px;min-height:64px;font-size:21px;font-weight:1000;color:#4d2b18;background:linear-gradient(#ffe17c,#ffb83f);box-shadow:0 5px #cf8528;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}.btn:active{transform:translateY(3px);box-shadow:0 2px #cf8528}.btn:disabled{opacity:.5}.subrow{display:flex;gap:8px;margin-top:10px}.sub{flex:1;border:2px solid #cfab8a;border-radius:12px;background:#fffaf2;min-height:42px;color:#603b27;font-weight:900;font-size:13px}.rules{font-size:12px;line-height:1.65;background:#fff8eac9;border-radius:13px;padding:9px 12px;margin:13px 0 0}.hidden{display:none!important}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#3b22155c;pointer-events:none}.overlay span{font-size:76px;font-weight:1000;color:#fff;text-shadow:0 5px 0 #753d2c,0 7px 20px #000}.result{position:absolute;inset:0;background:#fff3dfef;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.resultcard{background:#fffdf7;border:3px solid #b68158;border-radius:22px;padding:18px 12px;width:100%;box-shadow:0 8px 0 #b68158}.result h2{font-size:30px;margin:0 0 10px}.big{font-size:62px;font-weight:1000;line-height:1.1;color:#8b4526}.result p{font-size:13px;font-weight:800;line-height:1.7}.result .sub{width:100%;margin-top:8px}.result .btn{min-height:48px;font-size:16px}.scores{margin:10px 0;font-size:12px;font-weight:900}.scores b{font-size:18px}footer{font-size:10px;opacity:.75;text-align:center;margin:10px 0}#tap{touch-action:manipulation} @media(max-height:740px){.stage{max-height:48dvh}.btn{min-height:55px}.rules{margin-top:8px}}
</style></head><body><main><header><h1>🐰 うんこ面接！</h1><p>10秒で何粒出せる？ 面接官にバレたら即終了！</p></header><div class="hud"><div class="stat"><span>⏱ 残り時間</span><b id="time">10.0</b></div><div class="stat"><span>● コロコロうんち</span><b id="count">0<small>粒</small></b></div><div class="stat"><span>🏆 自己ベスト</span><b id="best">0<small>粒</small></b></div></div><div class="stage" id="stage"><canvas id="scene" width="400" height="500" aria-label="茶色のネザーランドドワーフと白い垂れ耳の面接官"></canvas><div class="bubble" id="speech">本日はよろしくお願いします。</div><div class="notice" id="notice">！そろそろ気づくかも…</div><div class="overlay hidden" id="countdown"><span id="countnum">3</span></div><div class="result hidden" id="result"><div class="resultcard"><h2 id="resultTitle">結果発表</h2><div class="big" id="finalCount">0粒</div><p id="resultDetail"></p><div class="scores" id="record"></div><button class="btn" id="again">もう一度挑戦</button><button class="sub" id="share">𝕏 で結果をシェア</button><button class="sub" id="back">タイトルに戻る</button></div></div></div><div class="meterrow"><span>👁 怪しまれ度</span><div class="meter"><div class="fill" id="suspicion"></div></div><b id="susnum">0%</b></div><div class="tip" id="tip">面接官が目をそらした瞬間に連打！</div><button class="btn" id="tap">面接をはじめる ▶</button><div class="subrow"><button class="sub" id="how">遊び方</button><button class="sub" id="sound">🔊 効果音 ON</button></div><div class="rules" id="rules">制限時間は<strong>10秒</strong>。タップで1粒ずつ出せます。連打するほど怪しまれます。面接官が顔を上げたら要注意。<strong>見られた瞬間に出すと即失格</strong>。10秒生き残ったら出した数が記録になります。</div><footer>端末内ベスト記録 / Xで結果共有（リアルタイム対戦・世界ランキングは未実装）</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const canvas=$('scene'),ctx=canvas.getContext('2d');let state='idle',startTime=0,last=0,count=0,best=0,sus=0,look=false,lookNext=0,lookEnd=0,lookWarn=0,lastPoop=-9999,poops=[],particles=[],reason='',raf=0,quiet=false,round=0,flash=0,shake=0,shownWarning=false;try{best=+(localStorage.getItem('unkoInterviewBestV2')||0)}catch(e){}$('best').innerHTML=best+'<small>粒</small>';const W=400,H=500;const rnd=(a,b)=>a+Math.random()*(b-a);const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function ell(x,y,rx,ry,c,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.restore()}function line(x1,y1,x2,y2,color,w){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();if(typeof ctx.roundRect==='function'){ctx.roundRect(x,y,w,h,r)}else{let q=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));ctx.moveTo(x+q,y);ctx.lineTo(x+w-q,y);ctx.quadraticCurveTo(x+w,y,x+w,y+q);ctx.lineTo(x+w,y+h-q);ctx.quadraticCurveTo(x+w,y+h,x+w-q,y+h);ctx.lineTo(x+q,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-q);ctx.lineTo(x,y+q);ctx.quadraticCurveTo(x,y,x+q,y)}ctx.fill()}function gradient(y1,y2,colors){let g=ctx.createLinearGradient(0,y1,0,y2);for(let i=0;i<colors.length;i++)g.addColorStop(i/(colors.length-1),colors[i]);return g}function fur(x,y,rx,ry,c,n=55){ell(x,y,rx,ry,c);for(let i=0;i<n;i++){let a=i*2.3999,rr=Math.sqrt((i+.5)/n),px=x+Math.cos(a)*rx*rr,py=y+Math.sin(a)*ry*rr;ell(px,py,rnd(1,3.5),rnd(2,5),i%3?'#ffffff12':'#3b190b12',a)}}function ear(x,y,angle,white=false,flop=false){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ell(0,-46,flop?19:16,flop?55:64,white?'#e9e4dc':'#995a35',flop?-.5:0);ell(0,-45,flop?11:9,flop?40:48,white?'#d9aeb0':'#c78570',flop?-.5:0);ctx.restore()}function eye(x,y,scale=1){ell(x,y,7*scale,8*scale,'#1c1716');ell(x-2*scale,y-3*scale,2.4*scale,2.7*scale,'#fff')}function rabbitFront(x,y,s,white=false,flop=false,emotion=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let t=performance.now()/1000;let bob=state==='running'?Math.sin(t*14)*2:Math.sin(t*2)*1.5;ctx.translate(0,bob);let coat=white?'#f5f1e9':'#a8663e',light=white?'#fffaf5':'#c98c5b',dark=white?'#d3c6b9':'#794325';ear(-34,-74,flop?-.95:-.13,white,flop);ear(34,-74,flop?.95:.13,white,flop);fur(0,25,71,78,coat);ell(-47,88,27,17,light,-.2);ell(47,88,27,17,light,.2);fur(0,-22,65,62,light,100);ell(-49,4,23,28,coat);ell(49,4,23,28,coat);ell(0,15,35,27,white?'#f8f4ed':'#e9b994');eye(-24,-27);eye(24,-27);ell(-32,-42,13,6,'#ffffff24',-.5);ell(32,-42,13,6,'#ffffff24',.5);ell(0,0,7,5,'#b77878');line(0,5,0,12,dark,1.7);line(0,12,-8,16,dark,1.4);line(0,12,8,16,dark,1.4);for(let d of [-1,1])for(let j=0;j<3;j++)line(d*10,10+j*4,d*(55+j*2),7+j*8,white?'#c8bdb3':'#7a533e',.9);if(emotion>0){ell(48,-65,7,12,'#65bfe5');ell(48,-69,2,3,'#fff')}ctx.restore()}
function rabbitBack(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let bob=state==='running'?Math.sin(t*22)*4:Math.sin(t*2)*1.2;ctx.translate(0,bob);ear(-36,-69,-.12);ear(36,-69,.12);fur(0,26,83,100,'#a66a43',110);ell(0,92,29,28,'#f0d6b5');ell(-67,101,29,17,'#a76a45',-.25);ell(67,101,29,17,'#a76a45',.25);ctx.restore()}
function pellet(p){let z=p.r;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ell(0,z*.55,z*1.3,z*.43,'#28170d35');let g=ctx.createRadialGradient(-z*.35,-z*.4,1,0,0,z*1.4);g.addColorStop(0,'#997047');g.addColorStop(.4,'#624123');g.addColorStop(1,'#32200f');ell(0,0,z*1.1,z,g);for(let j=0;j<7;j++){let a=j*2.4;ell(Math.cos(a)*z*.65,Math.sin(a)*z*.6,z*.14,z*.11,j%2?'#c39a6755':'#160c0655')}ctx.restore()}
function draw(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;ctx.clearRect(0,0,W,H);ctx.fillStyle=gradient(0,500,['#e8d7c4','#d3b39a','#cda486']);ctx.fillRect(0,0,W,H);ctx.fillStyle='#eadbc7';ctx.fillRect(0,0,400,290);for(let i=0;i<9;i++){line(i*60-90,0,i*60+100,275,'#ffffff10',2)}roundRect(23,34,94,152,7,'#c5a88d');roundRect(30,40,80,140,3,'#f6e7cf');line(70,40,70,180,'#c5a88d',6);line(30,110,110,110,'#c5a88d',6);ell(355,135,44,69,'#7c976e');ell(330,112,29,47,'#91a17b');roundRect(343,177,27,32,4,'#a86b4d');roundRect(0,310,400,190,0,gradient(310,500,['#c79e78','#b98961']));for(let i=0;i<6;i++)line(0,344+i*35,400,350+i*35,'#8f644020',2);
// Interviewer: white lop-eared rabbit, suit, clipboard
roundRect(165,176,184,115,24,'#554942');roundRect(185,217,146,96,12,'#514c4a');ctx.fillStyle='#252c35';ctx.beginPath();ctx.moveTo(183,286);ctx.lineTo(196,232);ctx.lineTo(314,232);ctx.lineTo(332,286);ctx.fill();ctx.fillStyle='#f9f7f3';ctx.beginPath();ctx.moveTo(237,240);ctx.lineTo(255,277);ctx.lineTo(273,240);ctx.fill();ctx.fillStyle='#a34e43';ctx.beginPath();ctx.moveTo(253,248);ctx.lineTo(244,260);ctx.lineTo(254,283);ctx.lineTo(265,260);ctx.fill();rabbitFront(255,171,.69,true,true,look?1:0);roundRect(203,263,104,55,6,'#a27754');roundRect(210,270,90,43,3,'#f3e8d7');roundRect(240,260,30,9,4,'#c2b7a7');for(let i=0;i<3;i++)line(220,284+i*9,285,284+i*9,'#c9b9a7',2);
// Desk foreground and rabbit
roundRect(-12,287,424,39,3,'#6b432d');roundRect(-12,285,424,12,2,'#a5734b');roundRect(0,317,400,29,2,'#784f35');rabbitBack(201,379,1.05,t/1000);for(let p of poops){p.vy+=980*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.y>479-p.r){p.y=479-p.r;p.vy=-Math.abs(p.vy)*.42;p.vx*=.86;p.vr*=.85;if(Math.abs(p.vy)<20)p.vy=0}if(p.x<p.r||p.x>400-p.r){p.x=clamp(p.x,p.r,400-p.r);p.vx*=-.55}pellet(p)}poops=poops.slice(-120);if(shake>0){shake-=dt;ctx.fillStyle='#f8443b25';ctx.fillRect(0,0,400,500)}if(flash>0){flash-=dt;ctx.fillStyle='#ffffff22';ctx.fillRect(0,0,400,500)}raf=requestAnimationFrame(draw)}
function beep(f=440,d=.06){if(quiet)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=beep.a||(beep.a=new A());if(a.state==='suspended')a.resume();let o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function ui(){ $('time').textContent=(state==='running'?Math.max(0,10-(performance.now()-startTime)/1000):state==='finished'?0:10).toFixed(1);$('count').innerHTML=count+'<small>粒</small>';$('suspicion').style.width=clamp(sus,0,100)+'%';$('susnum').textContent=Math.round(clamp(sus,0,100))+'%';$('notice').classList.toggle('on',state==='running'&&(sus>58||shownWarning));}
function reset(){state='idle';count=0;sus=0;look=false;lookEnd=0;shownWarning=false;poops=[];lastPoop=-9999;round++;$('result').classList.add('hidden');$('countdown').classList.add('hidden');$('speech').textContent='本日はよろしくお願いします。';$('tip').textContent='面接官が目をそらした瞬間に連打！';$('tap').textContent='面接をはじめる ▶';$('tap').disabled=false;ui()}
function begin(){if(state!=='idle'&&state!=='finished')return;reset();state='countdown';$('tap').disabled=true;let n=3;$('countdown').classList.remove('hidden');$('countnum').textContent=n;beep(540);let token=round;let id=setInterval(()=>{if(token!==round){clearInterval(id);return}n--;if(n>0){$('countnum').textContent=n;beep(540)}else{clearInterval(id);$('countdown').classList.add('hidden');state='running';startTime=performance.now();lookNext=startTime+rnd(1500,2600);$('tap').disabled=false;$('tap').textContent='● 連打して出す！';$('speech').textContent='履歴書を拝見します…';$('tip').textContent='出しすぎ注意！視線とゲージを見て！';beep(850);requestAnimationFrame(update)}},700)}
function update(now){if(state!=='running')return;let elapsed=now-startTime,remaining=10000-elapsed;if(remaining<=0){finish(false,'10秒間の面接終了');return}if(!look&&now>=lookNext){shownWarning=true;$('speech').textContent='……何か音がしますね？';lookWarn=now+rnd(420,650);look=true;beep(230,.12)}if(look&&now>=lookWarn&&lookEnd===0){lookEnd=now+rnd(480,760);$('speech').textContent='……！';$('tip').textContent='⚠️ 面接官が見ている！タップ禁止！';beep(170,.15)}if(lookEnd&&now>=lookEnd){look=false;shownWarning=false;lookEnd=0;lookNext=now+rnd(1000,1950);$('speech').textContent='失礼、続けてください。';$('tip').textContent='今がチャンス！';}sus=Math.max(0,sus-(lookEnd?2:7)/60);if(sus>=100){finish(true,'怪しまれ度が限界！');return}ui();requestAnimationFrame(update)}
function poop(){if(state==='idle'||state==='finished'){begin();return}if(state!=='running')return;let now=performance.now();if(lookEnd>0){finish(true,'面接官と目が合った瞬間に出してしまった！');return}count++;let gap=now-lastPoop;lastPoop=now;sus+=gap<180?17:gap<350?12:8;flash=.08;let r=rnd(5.5,8.2);poops.push({x:202+rnd(-12,12),y:440,vx:rnd(-150,160),vy:rnd(-210,-110),vr:rnd(-9,9),rot:rnd(0,6.28),r});beep(rnd(140,240),.045);if(count%4===0)$('speech').textContent='……？';if(sus>=100){finish(true,'連打しすぎて音でバレた！');return}ui()}
function finish(caught,why){if(state!=='running')return;state='finished';reason=why;$('tap').disabled=true;$('tap').textContent='結果発表';$('resultTitle').textContent=caught?'💥 不採用！':'🏆 面接終了！';$('finalCount').textContent=count+'粒';$('resultDetail').textContent=why+(caught?' 記録は無効です。':' 無事に最後までバレずに耐えた！');if(caught){shake=.45;beep(120,.3)}else{beep(760,.18);if(count>best){best=count;try{localStorage.setItem('unkoInterviewBestV2',best)}catch(e){}$('best').innerHTML=best+'<small>粒</small>'}}$('record').innerHTML='今回の有効記録：<b>'+(caught?'0':count)+'</b>粒　｜　自己ベスト：<b>'+best+'</b>粒';$('result').classList.remove('hidden');ui()}
function activateTap(){if(state==='running')poop();else if(state==='idle')begin()}$('tap').addEventListener('click',activateTap);$('tap').addEventListener('touchend',e=>{if(e.cancelable)e.preventDefault();activateTap()},{passive:false});$('again').addEventListener('click',()=>{reset();begin()});$('back').addEventListener('click',reset);$('how').addEventListener('click',()=>{$('rules').classList.toggle('hidden')});$('sound').addEventListener('click',()=>{quiet=!quiet;$('sound').textContent=quiet?'🔇 効果音 OFF':'🔊 効果音 ON'});$('share').addEventListener('click',()=>{let valid=reason.includes('面接終了');let score=valid?count:0;let text='🐰 うんこ面接！ 10秒チャレンジ\n'+(valid?'面接官にバレずに '+score+'粒！':'面接官にバレて不採用…')+'\nあなたは何粒出せる？ #うんこ面接';let url='https://twitter.com/intent/tweet?'+new URLSearchParams({text,url:location.href}).toString();window.open(url,'_blank','noopener,noreferrer')});reset();raf=requestAnimationFrame(draw);window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));})();
</script></body></html>
