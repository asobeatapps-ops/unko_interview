function ui(){ $('time').textContent=(state==='running'?Math.max(0,10-(performance.now()-startTime)/1000):state==='finished'?0:10).toFixed(1);$('count').innerHTML=count+'<small>粒</small>';$('suspicion').style.width=clamp(sus,0,100)+'%';$('susnum').textContent=Math.round(clamp(sus,0,100))+'%';$('notice').classList.toggle('on',state==='running'&&(sus>58||shownWarning));}
function reset(){document.body.style.overflow='';state='idle';count=0;sus=0;look=false;lookEnd=0;shownWarning=false;poops=[];lastPoop=-9999;round++;$('result').classList.add('hidden');$('countdown').classList.add('hidden');$('speech').textContent='本日はよろしくお願いします。';$('tip').textContent='面接官が目をそらした瞬間に連打！';$('tap').textContent='面接をはじめる ▶';$('tap').disabled=false;ui()}
function begin(){if(state!=='idle'&&state!=='finished')return;reset();state='countdown';$('tap').disabled=true;let n=3;$('countdown').classList.remove('hidden');$('countnum').textContent=n;beep(540);let token=round;let id=setInterval(()=>{if(token!==round){clearInterval(id);return}n--;if(n>0){$('countnum').textContent=n;beep(540)}else{clearInterval(id);$('countdown').classList.add('hidden');state='running';startTime=performance.now();lookNext=startTime+rnd(1500,2600);$('tap').disabled=false;$('tap').textContent='● 連打して出す！';$('speech').textContent='履歴書を拝見します…';$('tip').textContent='出しすぎ注意！視線とゲージを見て！';beep(850);requestAnimationFrame(update)}},700)}
function update(now){if(state!=='running')return;let elapsed=now-startTime,remaining=10000-elapsed;if(remaining<=0){finish(false,'10秒間の面接終了');return}if(!look&&now>=lookNext){shownWarning=true;$('speech').textContent='……何か音がしますね？';lookWarn=now+rnd(420,650);look=true;beep(230,.12)}if(look&&now>=lookWarn&&lookEnd===0){lookEnd=now+rnd(480,760);$('speech').textContent='……！';$('tip').textContent='⚠️ 面接官が見ている！タップ禁止！';beep(170,.15)}if(lookEnd&&now>=lookEnd){look=false;shownWarning=false;lookEnd=0;lookNext=now+rnd(1000,1950);$('speech').textContent='失礼、続けてください。';$('tip').textContent='今がチャンス！';}sus=Math.max(0,sus-(lookEnd?2:7)/60);if(sus>=100){finish(true,'怪しまれ度が限界！');return}ui();requestAnimationFrame(update)}
function poop(){if(state==='idle'||state==='finished'){begin();return}if(state!=='running')return;let now=performance.now();if(lookEnd>0){finish(true,'面接官と目が合った瞬間に出してしまった！');return}count++;let gap=now-lastPoop;lastPoop=now;sus+=gap<180?17:gap<350?12:8;flash=.08;let r=rnd(5.5,8.2);poops.push({x:202+rnd(-12,12),y:440,vx:rnd(-150,160),vy:rnd(-210,-110),vr:rnd(-9,9),rot:rnd(0,6.28),r});beep(rnd(140,240),.045);if(count%4===0)$('speech').textContent='……？';if(sus>=100){finish(true,'連打しすぎて音でバレた！');return}ui()}
function finish(caught,why){if(state!=='running')return;state='finished';reason=why;$('tap').disabled=true;$('tap').textContent='結果発表';$('resultTitle').textContent=caught?'💥 不採用！':'🏆 採用！';$('finalCount').textContent=count+'粒';$('resultDetail').textContent=why+(caught?' 記録は無効です。':' 無事に最後までバレずに耐えた！');if(caught){shake=.45;beep(120,.3)}else{beep(760,.18);if(count>best){best=count;try{localStorage.setItem('unkoInterviewBestV2',best)}catch(e){}$('best').innerHTML=best+'<small>粒</small>'}}$('record').innerHTML='今回の有効記録：<b>'+(caught?'0':count)+'</b>粒　｜　自己ベスト：<b>'+best+'</b>粒';$('result').classList.remove('hidden');$('result').scrollTop=0;document.body.style.overflow='hidden';ui()}
function activateTap(){if(state==='running')poop();else if(state==='idle')begin()}$('tap').addEventListener('click',activateTap);$('tap').addEventListener('touchend',e=>{if(e.cancelable)e.preventDefault();activateTap()},{passive:false});$('again').addEventListener('click',()=>{reset();begin()});$('back').addEventListener('click',reset);$('how').addEventListener('click',()=>{$('rules').classList.toggle('hidden')});$('sound').addEventListener('click',()=>{quiet=!quiet;$('sound').textContent=quiet?'🔇 効果音 OFF':'🔊 効果音 ON'});$('share').addEventListener('click',()=>{let valid=reason.includes('面接終了');let score=valid?count:0;let text='🐰 うんこ面接！ 10秒チャレンジ\n'+(valid?'面接官にバレずに '+score+'粒！':'面接官にバレて不採用…')+'\nあなたは何粒出せる？ #うんこ面接';let url='https://twitter.com/intent/tweet?'+new URLSearchParams({text,url:location.href}).toString();window.open(url,'_blank','noopener,noreferrer')});reset();raf=requestAnimationFrame(draw);window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));})();
