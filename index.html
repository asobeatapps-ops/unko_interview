(()=>{'use strict';const $=id=>document.getElementById(id);let state='idle',startTime=0,count=0,best=0,sus=0,look=false,lookNext=0,lookEnd=0,lookWarn=0,lastPoop=-9999,reason='',quiet=false,round=0,shownWarning=false,anim=0,particles=[];const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));try{best=Number(localStorage.getItem('unkoInterviewBestV2'))||0}catch(e){}$('best').innerHTML=best+'<small>粒</small>';function beep(f=440,d=.06){if(quiet)return;try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let a=beep.a||(beep.a=new A());if(a.state==='suspended')a.resume();let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}function ui(){let remain=state==='running'?Math.max(0,10-(performance.now()-startTime)/1000):state==='finished'?0:10;$('time').textContent=remain.toFixed(1);$('count').innerHTML=count+'<small>粒</small>';$('suspicion').style.width=clamp(sus,0,100)+'%';$('susnum').textContent=Math.round(clamp(sus,0,100))+'%';$('question').classList.toggle('show',state==='running'&&shownWarning);$('chance').classList.toggle('show',state==='running'&&!shownWarning);$('interviewer').classList.toggle('looking',state==='running'&&lookEnd>0);$('interviewer').classList.toggle('away',state==='running'&&!shownWarning)}function reset(){state='idle';count=0;sus=0;look=false;lookEnd=0;shownWarning=false;lastPoop=-9999;round++;particles=[];$('pellets').replaceChildren();$('result').classList.add('hidden');$('countdown').classList.add('hidden');$('speech').textContent='本日はよろしくお願いします。';$('tip').textContent='面接官が目をそらした瞬間に連打！';$('tap').textContent='面接をはじめる ▶';$('tap').disabled=false;ui()}function begin(){if(state!=='idle'&&state!=='finished')return;reset();state='countdown';$('tap').disabled=true;let n=3,token=round;$('countdown').classList.remove('hidden');$('countnum').textContent=n;beep(540);let timer=setInterval(()=>{if(token!==round){clearInterval(timer);return}n--;if(n>0){$('countnum').textContent=n;beep(540)}else{clearInterval(timer);$('countdown').classList.add('hidden');state='running';startTime=performance.now();lookNext=startTime+rnd(1500,2600);$('tap').disabled=false;$('tap').textContent='● 連打して出す！';$('speech').textContent='履歴書を拝見します…';$('tip').textContent='視線とゲージを見て！';beep(850);requestAnimationFrame(update)}},700)}function update(now){if(state!=='running')return;let remaining=10000-(now-startTime);if(remaining<=0){finish(false,'10秒間の面接終了');return}if(!look&&now>=lookNext){shownWarning=true;look=true;lookWarn=now+rnd(420,650);$('speech').textContent='……何か音がしますね？';$('tip').textContent='❓ 面接官が気づきそう！';beep(230,.12)}if(look&&now>=lookWarn&&lookEnd===0){lookEnd=now+rnd(480,760);$('speech').textContent='……！？';$('tip').textContent='⚠️ 見られている！タップ禁止！';beep(170,.15)}if(lookEnd&&now>=lookEnd){look=false;shownWarning=false;lookEnd=0;lookNext=now+rnd(1000,1950);$('speech').textContent='失礼、続けてください。';$('tip').textContent='今がチャンス！'}sus=Math.max(0,sus-(lookEnd?2:7)/60);if(sus>=100){finish(true,'怪しまれ度が限界！');return}ui();requestAnimationFrame(update)}function addPellet(){let stage=$('stage'),el=document.createElement('div');el.className='pellet';let size=rnd(19,25),x=stage.clientWidth*.5+rnd(-16,16),y=stage.clientHeight*.83;el.style.width=size+'px';el.style.height=size+'px';$('pellets').appendChild(el);particles.push({el,x,y,vx:rnd(-150,150),vy:rnd(-260,-130),spin:rnd(-600,600),rot:0,size,at:performance.now()});if(particles.length>80){let p=particles.shift();p.el.remove()}$('player').classList.remove('pooping');void $('player').offsetWidth;$('player').classList.add('pooping')}function physics(now){let stage=$('stage'),h=stage.clientHeight,w=stage.clientWidth;for(let p of particles){let dt=Math.min(.04,(now-(p.at||now))/1000);p.at=now;p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;if(p.y>h-p.size-4){p.y=h-p.size-4;p.vy=-Math.abs(p.vy)*.38;p.vx*=.88;p.spin*=.82;if(Math.abs(p.vy)<30)p.vy=0}if(p.x<0||p.x>w-p.size){p.x=clamp(p.x,0,w-p.size);p.vx*=-.5}p.el.style.transform=`translate3d(${p.x}px,${p.y}px,0) rotate(${p.rot}deg)`}anim=requestAnimationFrame(physics)}function poop(){if(state!=='running')return;let now=performance.now();if(lookEnd>0){finish(true,'面接官と目が合った瞬間に出してしまった！');return}count++;let gap=now-lastPoop;lastPoop=now;sus+=gap<180?17:gap<350?12:8;addPellet();beep(rnd(140,240),.045);if(count%4===0)$('speech').textContent='……？';if(sus>=100){finish(true,'連打しすぎて音でバレた！');return}ui()}function finish(caught,why){if(state!=='running')return;state='finished';reason=why;$('tap').disabled=true;$('tap').textContent='結果発表';$('resultTitle').textContent=caught?'💥 不採用！':'🏆 採用！';$('finalCount').textContent=count+'粒';$('resultDetail').textContent=why+(caught?' 記録は無効です。':' 無事に最後までバレずに耐えた！');if(caught){beep(120,.3)}else{beep(760,.18);if(count>best){best=count;try{localStorage.setItem('unkoInterviewBestV2',best)}catch(e){}$('best').innerHTML=best+'<small>粒</small>'}}$('record').innerHTML='今回の有効記録：<b>'+(caught?'0':count)+'</b>粒 ｜ 自己ベスト：<b>'+best+'</b>粒';$('result').classList.remove('hidden');$('result').scrollTop=0;ui()}$('tap').addEventListener('click',()=>{if(state==='idle')begin();else if(state==='running')poop()});$('again').addEventListener('click',()=>{reset();begin()});$('back').addEventListener('click',reset);$('how').addEventListener('click',()=>$('rules').classList.toggle('hidden'));$('sound').addEventListener('click',()=>{quiet=!quiet;$('sound').textContent=quiet?'🔇 効果音 OFF':'🔊 効果音 ON'});$('share').addEventListener('click',()=>{let valid=reason.includes('面接終了'),score=valid?count:0;let text='🐰 うんこ面接！ 10秒チャレンジ\n'+(valid?'面接官にバレずに '+score+'粒！':'面接官にバレて不採用…')+'\nあなたは何粒出せる？ #うんこ面接';let url='https://twitter.com/intent/tweet?'+new URLSearchParams({text,url:location.href}).toString();window.open(url,'_blank','noopener,noreferrer')});reset();anim=requestAnimationFrame(physics);window.addEventListener('pagehide',()=>cancelAnimationFrame(anim))})();
